name: Raon clinic timed reminders

on:
  schedule:
    # 10분마다 (UTC). GitHub 사정으로 몇 분 늦을 수 있다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminders
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          test -n "$CRON_KEY" || { echo "CRON_KEY secret is not set"; exit 1; }
          curl -fsS -m 30 --retry 2 -X POST -H "x-cron-key: $CRON_KEY" https://raon-clinic-demo.pages.dev/api/cron/run
